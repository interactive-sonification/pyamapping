[project]
name = "pyamapping"
description = "A Python package containing audio related functions and mappings"
version = "0.1.0"
authors = [
    { name = "Thomas Hermann", email = "thermann@techfak.uni-bielefeld.de"},
    { name = "Dennis Reinsch", email = "dreinsch@techfak.uni-bielefeld.de"}
]
maintainers = [
    {name = "Fabian Hommel", email = "fhommel@techfa.uni-bielefeld.de"}
]
readme = "README.rst"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
]
license = "MIT"
license-files = ["LICEN[CS]E*", "AUTHORS.rst"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python"
]

[project.urls]
github = "https://github.com/interactive-sonification/pyamapping"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyamapping"]

[project.optional-dependencies]
example-notebooks = ["notebook"]

[tool.uv]
dev-dependencies = ["tox", "pytest", "pytest-cov", "pre-commit", "sphinx"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "T10"]  # E/F = flake8, I = isort
ignore = ["E702"]

[tool.ruff.lint.isort]
known-first-party = ["pyamapping"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
addopts = "--cov=pyamapping --cov-report=lcov --cov-report=term-missing"
testpaths = ["tests"]  
